extends: existence
message: "'%s' is vague marketing language — replace with a specific claim or remove."
level: warning
ignorecase: true
nonword: false
tokens:
  - world[- ]class
  - best[- ]in[- ]class
  - cutting[- ]edge
  - bleeding[- ]edge
  - state[- ]of[- ]the[- ]art
  - next[- ]generation
  - next[- ]gen
  - game[- ]chang(?:er|ing)
  - revolutionary
  - paradigm shift
  - synergy
  - synergies
  - mission[- ]critical
  - turnkey
  - one[- ]stop[- ]shop
  - holistic
  - end[- ]to[- ]end solution
  - robust(?:ly)?
  - seamless(?:ly)?
  - frictionless
  - empower(?:s|ed|ing)?
  - unleash
  # Bare `unlock` supersedes the narrower `unlock the power of` it replaces: a
  # 2026 corpus pass (MD-2574) found the plain verb is the form that actually
  # ships, and the longer phrase is a subset of this pattern.
  - unlock(?:s|ed|ing)?
  - elevate(?:s|d|ing)?
  - delve(?:s|d|ing)?
  # Curly and straight apostrophes both appear in the corpus.
  - in today['’]s
  - take it to the next level
  - move the needle
  - circle back
